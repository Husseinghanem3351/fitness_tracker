name: ZELORA CI/CD - Build & Sign

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify GitHub Secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::MISSING SECRET: KEYSTORE_BASE64 is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.STORE_PASSWORD }}" ]; then
            echo "::error::MISSING SECRET: STORE_PASSWORD is not set!"
            exit 1
          fi
          echo "All required secrets are present."

      - name: Decode Keystore
        run: |
          import base64
          import os

          encoded = os.environ.get('KEYSTORE_BASE64')
          # Clean all possible whitespace/newlines from the user's copy-paste
          clean_encoded = "".join(encoded.split())
          
          try:
              decoded = base64.b64decode(clean_encoded)
              with open("zelora-release-key.jks", "wb") as f:
                  f.write(decoded)
              print("Successfully decoded keystore using Python logic.")
          except Exception as e:
              print(f"::error::Python decoding failed: {str(e)}")
              exit(1)
        shell: python
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=../zelora-release-key.jks" >> android/key.properties

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release --no-pub

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
